name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: server/dist/

  build-binary:
    needs: build-frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, suffix: '' }
          - { goos: linux, goarch: arm, goarm: '7', suffix: '-arm' }
          - { goos: linux, goarch: arm64, suffix: '-arm64' }
          - { goos: darwin, goarch: amd64, suffix: '-macos-x86_64' }
          - { goos: darwin, goarch: arm64, suffix: '-macos-arm64' }
          - { goos: windows, goarch: amd64, suffix: '.exe' }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: server/go.sum
      - uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: server/embedfs/dist/
      - name: Build
        working-directory: server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm || '7' }}
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go build -ldflags="-s -w -X cosmomail/buildinfo.Version=${VERSION} -X main.isProduction=true" -o "../dist/cosmomail${{ matrix.suffix }}" .
      - uses: actions/upload-artifact@v5
        with:
          name: cosmomail-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/cosmomail${{ matrix.suffix }}

  build-apk:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Build web dist for Capacitor
        working-directory: web
        run: |
          pnpm build
          rm -rf dist-web && mkdir dist-web
          cp -r ../server/dist/* dist-web/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Accept Android SDK licenses (runner 已预装 SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Sync Capacitor assets into Android project
        working-directory: web
        run: npx cap sync android
      - name: Build debug APK
        working-directory: web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: cosmomail-android-apk
          path: web/android/app/build/outputs/apk/debug/app-debug.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-binary, build-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: cosmomail-*
          merge-multiple: true
      - name: Rename APK
        run: mv artifacts/app-debug.apk "artifacts/CosmoMail-mobile-${GITHUB_REF_NAME}.apk"
      - name: Build fnOS package
        run: |
          sed -i "s/^version=.*/version=${GITHUB_REF_NAME#v}/" fnapp/manifest
          cp artifacts/cosmomail fnapp/app/server/cosmomail
          chmod +x fnapp/app/server/cosmomail fnapp/cmd/*
          cp public/images/icon_64.png fnapp/ICON.PNG
          cp public/images/icon_256.png fnapp/ICON_256.PNG
          cp public/images/icon_64.png fnapp/app/ui/images/icon-64.png
          cp public/images/icon_256.png fnapp/app/ui/images/icon-256.png
          cp LICENSE fnapp/LICENSE
          curl -fsSL https://static2.fnnas.com/fnpack/fnpack-1.2.1-linux-amd64 -o fnpack
          chmod +x fnpack
          (cd fnapp && ../fnpack build)
          mv fnapp/com.goodmen001.cosmomail.fpk "artifacts/CosmoMail-fnOS-x86_64-${GITHUB_REF_NAME}.fpk"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
