services:
  novamail:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-latest}
    image: novamail:latest
    container_name: novamail
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 监听配置
      NOVAMAIL_HOST: 0.0.0.0
      NOVAMAIL_PORT: 8080
      NOVAMAIL_DSN: /app/data/novamail.db
      TZ: ${TZ:-Asia/Shanghai}

      # 安全配置（可选：首次启动自动生成并持久化到数据库）
      # JWT 签名密钥，用于登录会话
      # NOVAMAIL_JWT_SECRET: change-me-to-a-long-random-string
      # 敏感字段（密码/Token）AES-256-GCM 加密密钥
      # NOVAMAIL_ENCRYPT_KEY: change-me-to-another-long-random-string

      # Outlook / Microsoft OAuth2 默认 Client ID
      # 在 Azure 注册应用后填入（详见 docs/guide/oauth2-microsoft.md）
      # NOVAMAIL_OAUTH_MICROSOFT_CLIENT_ID: your-azure-client-id

      # 同步配置
      # NOVAMAIL_POLL_INTERVAL: 60
      # NOVAMAIL_IDLE_ENABLED: "true"
      # NOVAMAIL_MAX_CONCURRENT: 10
    volumes:
      - novamail-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  novamail-data:
