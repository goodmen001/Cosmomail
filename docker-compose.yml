services:
  cosmomail:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-latest}
    image: cosmomail:latest
    container_name: cosmomail
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 监听配置
      COSMOMAIL_HOST: 0.0.0.0
      COSMOMAIL_PORT: 8080
      COSMOMAIL_DSN: /app/data/cosmomail.db
      TZ: ${TZ:-Asia/Shanghai}

      # 安全配置（生产环境强烈建议显式设置）
      # JWT 签名密钥，用于登录会话
      # COSMOMAIL_JWT_SECRET: change-me-to-a-long-random-string
      # 敏感字段（密码/Token）AES-256-GCM 加密密钥
      # COSMOMAIL_ENCRYPT_KEY: change-me-to-another-long-random-string

      # Outlook / Microsoft OAuth2 默认 Client ID
      # 在 Azure 注册应用后填入（详见 docs/guide/oauth2-microsoft.md）
      # COSMOMAIL_OAUTH_MICROSOFT_CLIENT_ID: your-azure-client-id

      # 同步配置
      # COSMOMAIL_POLL_INTERVAL: 60
      # COSMOMAIL_IDLE_ENABLED: "true"
      # COSMOMAIL_MAX_CONCURRENT: 10
    volumes:
      - cosmomail-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  cosmomail-data:
